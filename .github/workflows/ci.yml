name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - name: Git version
        run: git --version

      - name: Check formatting
        run: zig fmt --check build.zig src tests

      - name: Build
        run: zig build

      - name: Debug tests
        run: zig build test

      - name: ReleaseSafe tests
        run: zig build test -Doptimize=ReleaseSafe

