name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - name: Verify release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag: $TAG"
            exit 1
          }

          grep -Fq ".version = \"$version\"" build.zig.zon || {
            echo "::error::build.zig.zon must contain version $version"
            exit 1
          }

          git fetch origin main
          git merge-base --is-ancestor \
            "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release tag is not on main"
            exit 1
          }

      - name: Test
        run: zig build test -Doptimize=ReleaseSafe

      # checkout replaces an annotated tag with a lightweight one; the notes
      # and title read the codename from the tag message
      - name: Restore annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip all
        env:
          OUTPUT: notes/notes.md
          STAKRR_RELEASE: "1"

      - name: Release title
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # tag subjects read "stakrr vX.Y.Z - <codename>"
          subject="$(git tag -l --format='%(contents:subject)' "$TAG")"
          title="stakrr $TAG"
          if [[ "$subject" == *" - "* ]]; then
            title+=" ── ${subject##* - }"
          fi
          printf '%s\n' "$title" > notes/title.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-latest
            target: aarch64-linux-musl
          - os: macos-latest
            target: x86_64-macos
          - os: macos-latest
            target: aarch64-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.0"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          zig build \
            -Dtarget="$TARGET" \
            -Doptimize=ReleaseSafe

          mkdir -p stage
          cp zig-out/bin/stakrr stage/
          cp LICENSE stage/

          tar -czf \
            "stakrr-${GITHUB_REF_NAME}-${TARGET}.tar.gz" \
            -C stage stakrr LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: stakrr-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )

          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "$(cat dist/title.txt)" \
            --notes-file dist/notes.md
